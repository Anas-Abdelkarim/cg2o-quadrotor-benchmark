[pytest]
# ROS stubs modify process-global modules: the controller and tools suites run
# in separate pytest processes (make test).
testpaths =
    tests
    src/px4_nmpc_core/test
    src/px4_nmpc_compare/test
    tools/solver_tuning/tests
# make the source tree importable without a colcon build
pythonpath =
    src/px4_nmpc_core
    src/px4_nmpc_controller
    src/px4_nmpc_compare
    src/px4_nmpc_tools
    src/px4_nmpc_bringup
    tools/solver_tuning/src
